services:
  advisor-v2-api:
    build:
      context: ./backend
    ports:
      - "8100:8100"
    environment:
      LAB_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      STOCKFISH_PATH: /usr/games/stockfish
      LAB_ANALYSIS_DEPTH: "12"
      LAB_MULTIPV: "5"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100
