services:
  lab-api:
    build:
      context: ./backend
    ports:
      - "8100:8100"
    environment:
      LAB_APP_ENV: development
      LAB_ALLOWED_ORIGINS: http://127.0.0.1:5174,http://localhost:5174
      STOCKFISH_PATH: /usr/games/stockfish
      LAB_ANALYSIS_DEPTH: "10"
      LAB_MULTIPV: "5"
      LAB_SEED: "42"
    volumes:
      - ../stockfish:/stockfish:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100

  # Optional infra for later persistence workers (MVP uses in-memory store).
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["full"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: anticheat_lab
    ports:
      - "5432:5432"
    profiles: ["full"]
